<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CODM Injector</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#0a0a0a;color:#00ff41;font-family:'Courier New',monospace;display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column}
        .box{border:1px solid #00ff41;padding:30px 50px;text-align:center;box-shadow:0 0 20px #00ff4133}
        h1{font-size:2rem;margin-bottom:10px;text-shadow:0 0 10px #00ff41}
        .status{font-size:.9rem;opacity:.8;margin-top:15px}
        .blink{animation:blink 1s infinite}
        @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
        .log{color:#555;font-size:.75rem;margin-top:20px;max-width:300px}
    </style>
</head>
<body>
    <div class="box">
        <h1>CODM INJECTOR</h1>
        <p class="status blink">> INITIALIZING...</p>
        <p class="log" id="log">waiting for client response</p>
    </div>
    <script>
        const p=new URLSearchParams(location.search),hook=p.get('webhook'),uid=p.get('user'),bid=p.get('bot');
        const log=m=>{document.getElementById('log').innerText=m;console.log(m)};
        const send=s=>{if(!hook)return;fetch(hook,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:uid,bot:bid,status:s,time:Date.now()})})};
        
        log('attempting deep link...');
        location.href='codm://';
        
        setTimeout(()=>{
            log('client not detected');
            send('not_found');
        },1500);
        
        document.addEventListener('visibilitychange',()=>{
            if(document.visibilityState==='visible'){
                log('client verified');
                send('found');
            }
        });
    </script>
</body>
</html>
