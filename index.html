<!DOCTYPE html>
<html>
<head>
    <title>CODM Deep Link Launcher</title>
</head>
<body>
    <h2 style="font-family: sans-serif; text-align: center; margin-top: 50px;">
        Checking for Call of Duty: Mobile client...
    </h2>

    <script>
        // PASTED WEBHOOK URL FROM STEP 1
        const discordWebhookUrl = "https://discord.com/api/webhooks/1520792881374302418/dFj1qh6gZRHhbycYfdJK7nArmDBhxjqAdsRtAkK_jbZCIkDcPVjKUw1Re46z9-HnwTv_"; 
        
        const startTime = Date.now();

        // 1. Force the phone to try opening the game client
        window.location.href = "codm://";

        // 2. Setup a timer hack. 
        // If the game client opens, this browser tab pauses in the background.
        // If the browser tab stays open and active for 1.5 seconds, it means CODM is missing.
        setTimeout(() => {
            const timePassed = Date.now() - startTime;

            if (timePassed < 2000) {
                // The browser never paused! The game is definitely NOT on the device.
                sendToDiscord("❌ **Game failed to launch.** CODM is not installed on this user's device.");
                
                // Redirect them to the App Store so they can download it
                window.location.href = "https://apple.com";
            }
        }, 1500);

        // 3. Monitor when the browser returns to focus
        // If the game was installed, the user eventually closes it and returns here.
        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "visible") {
                sendToDiscord("✅ **Success!** CODM client was successfully located and opened on the device.");
            }
        });

        // Function to talk back to your Discord Bot channel
        function sendToDiscord(messageText) {
            fetch(discordWebhookUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ content: messageText })
            });
        }
    </script>
</body>
</html>
