<!DOCTYPE html>
<html>
<head>
    <title>CODM Deep Link Launcher</title>
</head>
<body>
    <h2 style="font-family: sans-serif; text-align: center; margin-top: 50px;">
        Verifying Call of Duty: Mobile client...
    </h2>

    <script>
        // 1. Grab variables from the URL (The bot will send these automatically)
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('user');
        const botId = urlParams.get('bot');

        const startTime = Date.now();

        // 2. Force the phone to try opening the game client
        window.location.href = "codm://";

        // 3. Timer Hack: If browser stays open for 1.5s, it failed
        setTimeout(() => {
            if (Date.now() - startTime < 2000) {
                reportToBot("failed");
                window.location.href = "https://apple.com";
            }
        }, 1500);

        // 4. Focus Hack: If user goes to the game and comes back, it worked
        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "visible") {
                reportToBot("success");
            }
        });

        // Tells your BDFD Bot the result using BDFD's public API
        function reportToBot(status) {
            if (!userId || !botId) return;
            
            fetch(`https://botdesignerdiscord.com`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    botId: botId,
                    userId: userId,
                    variableName: "codm_status",
                    value: status
                })
            });
        }
    </script>
</body>
</html>
